<!DOCTYPE html>
<html>
<head>
    <title>Map with Selectable Polygons - PostMessage Data</title>
    <style>
        /* Essential styles remain the same */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        /* Style for the overlay display */
        #status-overlay {
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: white; 
            padding: 10px; 
            border: 1px solid #ccc; 
            z-index: 100;
            font-family: Arial, sans-serif;
            border-radius: 4px;
        }
        #selected-list {
            font-weight: bold;
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div id="status-overlay">
        Current Selected IDs: <span id="selected-list">None</span>
    </div>

    <script>
        // --- APPLICATION STATE AND DATA ---
        
        const selectedAreaIds = []; 
        let currentMapData = null; // Will store data passed from RN via postMessage
        let mapInitialized = false; // Flag to prevent re-initialization
        let googleApiLoaded = false; // Flag to track API script status

        // ⭐️ Default center coordinates (e.g., center of Jordan, Amman)
        const DEFAULT_MAP_CENTER = { lat: 31.9566, lng: 35.9456 }; 
        const DEFAULT_MAP_ZOOM = 6;
        
        // Single color and new opacity settings
        const AREA_COLOR = "#FFC600";
        const DEFAULT_OPACITY = 0.20;
        const SELECTED_OPACITY = 0.60;
        
        // --- CORE SELECTION LOGIC (Unchanged) ---

        function handleAreaSelection(areaId, areaObject) {
            const indexInSelectedList = selectedAreaIds.indexOf(areaId);
            
            if (indexInSelectedList > -1) {
                selectedAreaIds.splice(indexInSelectedList, 1);
                areaObject.setOptions({ fillOpacity: DEFAULT_OPACITY });
            } else {
                selectedAreaIds.push(areaId);
                areaObject.setOptions({ fillOpacity: SELECTED_OPACITY });
            }
            
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'selection_change',
                    data: selectedAreaIds
                }));
            }

            updateSelectedListDisplay(selectedAreaIds);
            return selectedAreaIds;
        }

        function updateSelectedListDisplay(selectedIds) {
            const displayElement = document.getElementById("selected-list");
            displayElement.textContent = selectedIds.length > 0 
                ? selectedIds.join(', ') 
                : 'None';
        }

        // --- GOOGLE MAPS INITIALIZATION (MODIFIED) ---

        function initMap() {
            if (mapInitialized) return;
            
            // SYNCHRONIZATION CHECK
            if (!googleApiLoaded) {
                // If API isn't ready, initialization will be re-attempted when it loads
                return;
            }

            const hasPolygons = currentMapData && 
                               currentMapData.multiAreaCoordinates && 
                               currentMapData.multiAreaCoordinates.length > 0;
            
            let center = DEFAULT_MAP_CENTER;
            let zoom = DEFAULT_MAP_ZOOM;
            let bounds = new google.maps.LatLngBounds();
            
            // ⭐️ LOGIC FOR MAP DISPLAY WITH/WITHOUT DATA
            if (hasPolygons) {
                console.log("Map initializing with polygons.");
                
                const multiAreaCoordinates = currentMapData.multiAreaCoordinates;
                const areasData = currentMapData.areasData;
                const allCoordinates = multiAreaCoordinates.flat(); 

                // Determine center from first coordinate
                if (allCoordinates.length > 0) {
                     center = { lat: allCoordinates[0].lat, lng: allCoordinates[0].lng };
                     zoom = 10; // Zoom closer when polygons are present
                }


                // Initialize map object with the determined center/zoom
                const map = new google.maps.Map(document.getElementById("map"), {
                    center: center,
                    zoom: zoom,
                    mapTypeId: 'roadmap',
                });
                
                const infoWindow = new google.maps.InfoWindow();

                // Loop and DRAW Polygons
                multiAreaCoordinates.forEach((areaPath, index) => {
                    const data = areasData[index % areasData.length];

                    const area = new google.maps.Polygon({
                        paths: areaPath.map(c => ({ lat: c.lat, lng: c.lng })),
                        strokeColor: "#000000",
                        strokeOpacity: 0.8,
                        strokeWeight: 2,
                        fillColor: AREA_COLOR,     
                        fillOpacity: DEFAULT_OPACITY,
                    });

                    area.setMap(map);
                    
                    area.addListener('click', (event) => {
                        handleAreaSelection(data.id, area);
                        
                        infoWindow.setContent(`
                            <div style="font-weight: bold; color: ${AREA_COLOR};">${data.name} (ID: ${data.id})</div>
                            <div>${data.content}</div>
                            <div style="font-size: smaller; margin-top: 5px;">Total Selected: ${selectedAreaIds.length}</div>
                        `);
                        infoWindow.setPosition(event.latLng);
                        infoWindow.open(map);
                    });

                    areaPath.forEach(coord => {
                        bounds.extend(coord);
                    });
                });
                
                // Fit bounds to show all polygons
                map.fitBounds(bounds); 

            } else {
                 // ⭐️ FALLBACK: Initialize map with default center/zoom if no data
                console.log("Map initializing without polygons (No data received).");
                new google.maps.Map(document.getElementById("map"), {
                    center: DEFAULT_MAP_CENTER,
                    zoom: DEFAULT_MAP_ZOOM, 
                    mapTypeId: 'roadmap',
                });
                
                const displayElement = document.getElementById("selected-list");
                displayElement.textContent = 'No map data received.';
            }

            mapInitialized = true;
            console.log("Map initialized successfully!");
        }

        // --- DATA LISTENER ---
        window.addEventListener('message', (event) => {
            try {
                const message = JSON.parse(event.data);
                
                if (message.type === 'initial_data' && message.data) {
                    currentMapData = message.data;
                    console.log("Data received. Checking API status...");
                    if (googleApiLoaded) { 
                        initMap();
                    }
                }
            } catch (e) {
                console.error("Error processing message from React Native:", e);
            }
        });

        // --- API CALLBACK ---
        function onGoogleMapsApiLoad() {
            googleApiLoaded = true;
            console.log("Google Maps API script loaded. Checking data status...");
            
            // Attempt to initialize map regardless of whether data is present
            initMap();
        }
    </script>

    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVJ8t5ZLQDnGUIP13h_9oYV58e66Cg_bw&callback=onGoogleMapsApiLoad">
    </script>
</body>
</html>
