<!DOCTYPE html>
<html>
<head>
    </head>
<body>
    <div id="map"></div>
    
    <div id="status-overlay">
        Current Selected IDs: <span id="selected-list">None</span>
    </div>

    <script>
        // --- APPLICATION STATE AND DATA ---
        
        const selectedAreaIds = []; 
        let currentMapData = null; // Will store data passed via postMessage
        let mapInitialized = false; // Flag to prevent re-initialization

        const AREA_COLOR = "#FFC600";
        const DEFAULT_OPACITY = 0.20;
        const SELECTED_OPACITY = 0.60;
        
        // ❌ REMOVE: The getMapDataFromUrl function is no longer needed

        // --- CORE SELECTION LOGIC (Unchanged) ---
        function handleAreaSelection(areaId, areaObject) {
            const indexInSelectedList = selectedAreaIds.indexOf(areaId);
            
            if (indexInSelectedList > -1) {
                selectedAreaIds.splice(indexInSelectedList, 1);
                areaObject.setOptions({ fillOpacity: DEFAULT_OPACITY });
            } else {
                selectedAreaIds.push(areaId);
                areaObject.setOptions({ fillOpacity: SELECTED_OPACITY });
            }
            
            // Send the updated array of selected IDs back to React Native
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'selection_change',
                    data: selectedAreaIds
                }));
            }
            return selectedAreaIds;
        }

        // Helper function to update the HTML display
        function updateSelectedListDisplay(selectedIds) {
            const displayElement = document.getElementById("selected-list");
            displayElement.textContent = selectedIds.length > 0 
                ? selectedIds.join(', ') 
                : 'None';
        }

        // --- GOOGLE MAPS INITIALIZATION (Uses currentMapData) ---
        function initMap() {
            if (mapInitialized) return;

            const mapData = currentMapData; 

            if (!mapData || !mapData.multiAreaCoordinates || mapData.multiAreaCoordinates.length === 0) {
                console.error("Map initialization failed: No valid coordinate data.");
                return;
            }

            const multiAreaCoordinates = mapData.multiAreaCoordinates;
            const areasData = mapData.areasData;
            const allCoordinates = multiAreaCoordinates.flat(); 
            
            // Safety check for empty data to prevent crash
            if (allCoordinates.length === 0) {
                 console.error("No coordinates found to center map.");
                 return;
            }

            const map = new google.maps.Map(document.getElementById("map"), {
                center: allCoordinates[0],
                zoom: 10,
                mapTypeId: 'roadmap',
            });
            
            const infoWindow = new google.maps.InfoWindow();
            const bounds = new google.maps.LatLngBounds();

            multiAreaCoordinates.forEach((areaPath, index) => {
                const data = areasData[index % areasData.length];

                const area = new google.maps.Polygon({
                    paths: areaPath.map(c => ({ lat: c.lat, lng: c.lng })),
                    strokeColor: "#000000",
                    strokeOpacity: 0.8,
                    strokeWeight: 2,
                    fillColor: AREA_COLOR,     
                    fillOpacity: DEFAULT_OPACITY,
                });

                area.setMap(map);
                
                area.addListener('click', (event) => {
                    handleAreaSelection(data.id, area);
                    
                    infoWindow.setContent(`... (Infowindow content remains the same) ...`);
                    infoWindow.setPosition(event.latLng);
                    infoWindow.open(map);
                });

                areaPath.forEach(coord => {
                    bounds.extend(coord);
                });
            });

            map.fitBounds(bounds);
            mapInitialized = true; // Set flag after successful initialization
            console.log("Map initialized with data passed via postMessage.");
        }

        // ⭐️ NEW ENTRY POINT: Listens for data from React Native
        window.addEventListener('message', (event) => {
            try {
                // Ensure the message is from a trusted source, or specifically your RN app
                // For local WebView use, this is usually fine, but be careful in production!
                const message = JSON.parse(event.data);
                
                if (message.type === 'initial_data' && message.data) {
                    currentMapData = message.data;
                    // Check if Google Maps API is ready (window.google exists)
                    if (window.google) {
                        initMap();
                    } else {
                        // Wait for Google Maps API to load via the callback
                        console.log("Data received, waiting for Google Maps API to load...");
                    }
                }
            } catch (e) {
                console.error("Error processing message from React Native:", e);
            }
        });


        // Define the callback function for the Google Maps API script load
        // This handles cases where the API loads before the message is received
        function onGoogleMapsApiLoad() {
             // If data has already been received, initialize the map now
            if (currentMapData) {
                initMap();
            }
        }
    </script>

    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVJ8t5ZLQDnGUIP13h_9oYV58e66Cg_bw&callback=onGoogleMapsApiLoad">
    </script>
</body>
</html>
